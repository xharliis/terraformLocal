services:
  localstack:
    image: localstack/localstack-pro:latest
    container_name: localstack

    ports:
      - "4566:4566"

    environment:
      DEBUG: "1"
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}

    volumes:
      - "./localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
